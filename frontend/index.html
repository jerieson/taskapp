<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskapp</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      // Keep in sync with src/lib/theme.ts.
      ;(function () {
        var theme = 'brand-light'
        try {
          var saved = localStorage.getItem('taskapp-theme')
          if (saved === 'dark') theme = 'brand-dark'
          else if (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            theme = 'brand-dark'
        } catch (e) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'brand-dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
